# autorev. Postgres, Redis and RabbitMQ come from ../infra (start it first:
# cd ../infra && docker compose up -d). The backend connects as role `autorev` to database `appjs`, whose
# search_path is schema `autorev` (AUTOREV_DATABASE_URL in .env).
name: autorev

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AUTOREV_DATABASE_URL: ${AUTOREV_DATABASE_URL}
      AUTOREV_REDIS_URL: ${AUTOREV_REDIS_URL:-redis://redis:6379/0}
      AUTOREV_SECRET_KEY: change-me-in-production
      AUTOREV_CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://celery:celery_mq_pass@rabbitmq:5672//}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    networks:
      default:
      appjs: {aliases: [autorev-api]}
    volumes:
      - ./backend:/app

  frontend:
    # Static build served by nginx. For live reload while developing, run `npm run dev` in
    # frontend/ instead (http://localhost:3000).
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

networks:
  appjs:
    external: true # from ../infra



