# autorev's Celery workers. RabbitMQ, Redis and Postgres come from ../infra (start it first).
name: autorev-workers

services:
  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: celery -A phone_worker.celery_app worker --loglevel=info
    environment:
      AUTOREV_DATABASE_URL: ${AUTOREV_DATABASE_URL}
      AUTOREV_REDIS_URL: ${AUTOREV_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://celery:celery_mq_pass@rabbitmq:5672//}
    restart: unless-stopped
    networks:
      - appjs

  beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: celery -A phone_worker.celery_app beat --loglevel=info
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://celery:celery_mq_pass@rabbitmq:5672//}
    restart: unless-stopped
    networks:
      - appjs

  flower:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: celery -A phone_worker.celery_app flower --port=5555 --url_prefix=flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://celery:celery_mq_pass@rabbitmq:5672//}
    restart: unless-stopped
    networks:
      - appjs

networks:
  appjs:
    external: true # from ../infra


