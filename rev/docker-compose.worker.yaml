name: autorev-workers

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: celery
      RABBITMQ_DEFAULT_PASS: celery_mq_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - autorev-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: celery -A phone_worker.celery_app worker --loglevel=info
    environment:
      AUTOREV_DATABASE_URL: ${AUTOREV_DATABASE_URL}
      AUTOREV_REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://celery:celery_mq_pass@rabbitmq:5672//
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - autorev-network

  beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: celery -A phone_worker.celery_app beat --loglevel=info
    environment:
      CELERY_BROKER_URL: amqp://celery:celery_mq_pass@rabbitmq:5672//
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - autorev-network

  flower:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: celery -A phone_worker.celery_app flower --port=5555 --url_prefix=flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: amqp://celery:celery_mq_pass@rabbitmq:5672//
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - autorev-network

networks:
  autorev-network:
    external: true

volumes:
  rabbitmq-data:


