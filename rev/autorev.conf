# ── Frontend: autorev.postkaro.app → :3000 ───────────────────────────────────

server {
    server_name autorev.postkaro.app;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/autorev.postkaro.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/autorev.postkaro.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


# ── Backend API: api.autorev.postkaro.app → :8000 ────────────────────────────

server {
    server_name api.autorev.postkaro.app;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /flower/ {
        proxy_pass         http://localhost:5555;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/api.autorev.postkaro.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.autorev.postkaro.app/privkey.pem; # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.autorev.postkaro.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name api.autorev.postkaro.app;
    listen 80;
    return 404; # managed by Certbot
}


server {
    if ($host = autorev.postkaro.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name autorev.postkaro.app;

    listen 80;
    return 404; # managed by Certbot


}
