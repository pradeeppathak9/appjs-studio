# OpenRouter models this server may use. The provider is on when OPENROUTER_API_KEY is set; it
# then accepts only the models below with `enabled: true`. Requests or templates naming any other
# model are rejected at submit time.
#
# To use your own copy (e.g. a mounted file in production), set OPENROUTER_MODELS_FILE=/path.yaml.
# Changes take effect on restart.
#
# Model IDs: https://openrouter.ai/models?output_modalities=image
#
# Per-model keys:
#   id                OpenRouter model slug (required)
#   enabled           false keeps the entry for reference but blocks its use (default true)
#   label             free text for humans; not used by the server
#   modalities        sent as `modalities`. ["image", "text"] for models that also write text
#                     (Gemini, GPT); ["image"] for image-only models (Flux, Seedream...)
#   image_input       the model takes input images (edit / image-to-image) (default false)
#   max_input_images  cap on input images for this model (default 4)
#   aspect_ratio      send `image_config.aspect_ratio` (default true); turn off for models that
#                     reject it

# Model used when a request or template names provider "openrouter" without a model.
# Must be an enabled model.
default_model: google/gemini-2.5-flash-image

# OpenRouter returns one image per call; n > 1 makes parallel calls. Upper bound on n.
max_images: 4

# Aspect ratios offered in the console for every OpenRouter model.
aspect_ratios: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]

models:
  - id: google/gemini-2.5-flash-image
    label: Gemini 2.5 Flash Image (Nano Banana)
    enabled: true
    modalities: [image, text]
    image_input: true
    max_input_images: 4

  - id: google/gemini-3-pro-image-preview
    label: Gemini 3 Pro Image (Nano Banana Pro)
    enabled: true
    modalities: [image, text]
    image_input: true
    max_input_images: 4

  - id: openai/gpt-5-image-mini
    label: GPT-5 Image Mini
    enabled: true
    modalities: [image, text]
    image_input: true
    max_input_images: 4

  - id: openai/gpt-5-image
    label: GPT-5 Image (expensive)
    enabled: false
    modalities: [image, text]
    image_input: true
    max_input_images: 4

  - id: qwen/qwen-image-2.1-turbo
    label: "Qwen: Qwen Image 2.1 Turbo"
    enabled: true
    modalities: [image]
    image_input: true
    max_input_images: 4

  - id: qwen/qwen-image-2.1-pro
    label: "Qwen: Qwen Image 2.1 Pro"
    enabled: true
    modalities: [image]
    image_input: true
    max_input_images: 4

  - id: black-forest-labs/flux.2-pro
    label: FLUX.2 Pro
    enabled: false
    modalities: [image]
    image_input: true
    max_input_images: 4
