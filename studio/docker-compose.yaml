name: creative

x-app: &app
  build: .
  image: creative:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-creative}:${POSTGRES_PASSWORD:-creative}@db:5432/${POSTGRES_DB:-creative}
    DATA_DIR: /app/data
  volumes:
    - ./data:/app/data
  user: "${UID:-10001}:${GID:-10001}"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creative}
      POSTGRES_DB: ${POSTGRES_DB:-creative}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["creative", "db", "upgrade"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    command: ["creative", "serve"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-creative}:${POSTGRES_PASSWORD:-creative}@db:5432/${POSTGRES_DB:-creative}
      DATA_DIR: /app/data
      WORKER_ENABLED: "false"
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker:
    <<: *app
    command: ["creative", "worker"]
    healthcheck:
      test: ["CMD", "creative", "health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  web:
    build: ./web
    image: creative-web:dev
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata: {}
