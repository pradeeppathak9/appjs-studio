# AppJs Studio. Postgres comes from ../infra (start it first: cd ../infra && docker compose up -d):
# Studio connects as role `studio` to database `appjs`, whose search_path is schema `studio`.
name: studio

x-app: &app
  build: .
  image: studio:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://studio:${STUDIO_DB_PASSWORD:-studio}@postgres:5432/appjs
    DATA_DIR: /app/data
  volumes:
    - ./data:/app/data
  user: "${UID:-10001}:${GID:-10001}"
  networks: [default, appjs]

services:
  migrate:
    <<: *app
    command: ["studio", "db", "upgrade"]
    restart: "no"

  api:
    <<: *app
    command: ["studio", "serve"]
    environment:
      DATABASE_URL: postgresql://studio:${STUDIO_DB_PASSWORD:-studio}@postgres:5432/appjs
      DATA_DIR: /app/data
      WORKER_ENABLED: "false"
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks:
      default:
      appjs: {aliases: [studio-api]}
    restart: unless-stopped

  worker:
    <<: *app
    command: ["studio", "worker"]
    healthcheck:
      test: ["CMD", "studio", "health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  web:
    build: ./web
    image: studio-web:dev
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api: {condition: service_healthy}
    networks:
      default:
      appjs: {aliases: [studio-web]}
    restart: unless-stopped

networks:
  appjs:
    external: true # from ../infra
