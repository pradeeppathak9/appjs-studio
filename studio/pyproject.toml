[project]
name = "studio"
version = "0.1.0"
description = "Prompt- and template-driven image/video generation service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "argon2-cffi>=23.1",
    "google-genai>=1.0",
    "google-auth>=2.30",
    "openai>=1.40",
    "fal-client>=0.4",
    "pyyaml>=6.0",
]

[project.scripts]
studio = "studio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
"studio.providers" = ["*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["smoke: calls real provider APIs (needs keys)"]
addopts = "-m 'not smoke'"
