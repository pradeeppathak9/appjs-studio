server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;

    # Resolve the api container through Docker's DNS on each request (cached 10 s), not once at
    # startup: rebuilding or restarting the api gives it a new address, and a startup-time lookup
    # would keep proxying to the old one (502 until this container restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Keep the browser's Host: the API checks Origin against it on cookie-authenticated writes.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Generated assets and job inputs: stream them (video, Range requests) instead of buffering.
    location /v1/assets/ {
        proxy_pass $api;
        proxy_buffering off;
    }
    location /v1/inputs/ {
        proxy_pass $api;
        proxy_buffering off;
    }
    location /v1/ {
        proxy_pass $api;
    }
    location = /healthz {
        proxy_pass $api;
    }

    # Hashed build files can be cached forever; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
