# AppJs Studio on a server, from published images (no source checkout needed).
#
#   cp env.example .env            # fill it in
#   docker compose -f docker-compose.prod.yaml pull
#   docker compose -f docker-compose.prod.yaml up -d
#
# Caddy terminates HTTPS for $DOMAIN (certificates from Let's Encrypt, renewed automatically) and
# forwards everything to the web container, whose nginx serves the console and proxies /v1 to the
# API. Only ports 80 and 443 are public; the API, worker and Postgres stay on the internal network.
name: creative

x-app: &app
  image: ${STUDIO_IMAGE:?set STUDIO_IMAGE in .env}:${TAG:-latest}
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-creative}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-creative}
    DATA_DIR: /app/data
    COOKIE_SECURE: "true"
  volumes:
    - ./data:/app/data # uploads, inputs and generated images: back this up with the database
  user: "10001:10001" # the image's app user; ./data must belong to it (see README)
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-creative}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["creative", "db", "upgrade"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    command: ["creative", "serve"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-creative}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-creative}
      DATA_DIR: /app/data
      COOKIE_SECURE: "true"
      WORKER_ENABLED: "false"
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["creative", "worker"]
    healthcheck:
      test: ["CMD", "creative", "health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  web:
    image: ${STUDIO_WEB_IMAGE:?set STUDIO_WEB_IMAGE in .env}:${TAG:-latest}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  caddy:
    image: caddy:2
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:?set DOMAIN in .env}", "--to", "web:80"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
