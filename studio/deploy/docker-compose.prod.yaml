# AppJs Studio and the Restyle web app on a server, from published images (no source checkout needed).
# Postgres and Caddy (HTTPS) come from ../../infra, which runs first on the same server:
#
#   (infra)  docker compose --profile edge up -d
#   (here)   cp env.example .env           # fill it in
#            docker compose -f docker-compose.prod.yaml pull
#            docker compose -f docker-compose.prod.yaml up -d
#
# Studio connects as role `studio` to database `appjs` (schema `studio`). Caddy serves STUDIO_DOMAIN
# from `studio-web` (the console, whose nginx also proxies /v1 to the API) and RESTYLE_DOMAIN from
# `restyle-web` (whose nginx proxies only /v1/app): both are aliases on the `appjs` network. Nothing
# here publishes a port.
name: creative

x-app: &app
  image: ${STUDIO_IMAGE:?set STUDIO_IMAGE in .env}:${TAG:-latest}
  env_file: .env
  environment:
    DATABASE_URL: postgresql://studio:${STUDIO_DB_PASSWORD:?set STUDIO_DB_PASSWORD (same as infra)}@postgres:5432/appjs
    DATA_DIR: /app/data
    COOKIE_SECURE: "true"
  volumes:
    - ./data:/app/data # uploads, inputs and generated images: back this up with the database
  user: "10001:10001" # the image's app user; ./data must belong to it (see README)
  networks: [default, appjs]
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: ["creative", "db", "upgrade"]
    restart: "no"

  api:
    <<: *app
    command: ["creative", "serve"]
    environment:
      DATABASE_URL: postgresql://studio:${STUDIO_DB_PASSWORD:?set STUDIO_DB_PASSWORD (same as infra)}@postgres:5432/appjs
      DATA_DIR: /app/data
      COOKIE_SECURE: "true"
      WORKER_ENABLED: "false"
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks:
      default:
      appjs: {aliases: [studio-api]}

  worker:
    <<: *app
    command: ["creative", "worker"]
    healthcheck:
      test: ["CMD", "creative", "health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s
    depends_on:
      migrate: {condition: service_completed_successfully}

  web:
    image: ${STUDIO_WEB_IMAGE:?set STUDIO_WEB_IMAGE in .env}:${TAG:-latest}
    depends_on:
      api: {condition: service_healthy}
    networks:
      default:
      appjs: {aliases: [studio-web]}
    restart: unless-stopped

  # The Restyle web app (../../restyle-web). APP_KEY is the Studio app key of restyle-ai (it ships in
  # the page, like in the APK).
  restyle-web:
    image: ${RESTYLE_WEB_IMAGE:-ghcr.io/pradeeppathak9/restyle-web}:${RESTYLE_TAG:-latest}
    environment:
      APP_KEY: ${RESTYLE_APP_KEY:-}
      STUDIO_API: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    networks:
      default:
      appjs: {aliases: [restyle-web]}
    restart: unless-stopped

networks:
  appjs:
    external: true # from infra
